function openModal(innerHtml){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal">${innerHtml}</div></div>`;
  $('#modalBackdrop').onclick = e=>{ if(e.target.id==='modalBackdrop') closeModal(); };
  return root;
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

/* =========================================================================
   SONG EDITOR (Simple + Advanced ChordPro dual-mode)
   ========================================================================= */
function openEditor(song){
  const isNew = !song;
  const s = song || {id:uid(), title:'', artist:'', album:'', key:'C', bpm:100, timeSig:'4/4', capo:0, rhythmId:'basic44', genre:'', notes:'', favorite:false, tags:[], sections:[{name:'Verse',lines:[]}], chordDuration:2, tuning:'Standard E', instrument:'guitar', created:Date.now(), updated:Date.now()};
  const workingSections = JSON.parse(JSON.stringify(s.sections));
  const modal = openModal(`
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
      <h2 style="margin:0;">${isNew?'Yeni Şarkı':'Şarkıyı Düzenle'}</h2>
      ${isNew?'<button class="btn" id="btnGoImport">📄 Dosyadan İçe Aktar</button>':''}
    </div>
    <div class="formgrid">
      <div class="formrow"><label>Şarkı Adı</label><input type="text" id="eTitle" value="${escapeHtml(s.title)}"></div>
      <div class="formrow"><label>Sanatçı</label><input type="text" id="eArtist" value="${escapeHtml(s.artist)}"></div>
      <div class="formrow"><label>Ton</label><input type="text" id="eKey" value="${escapeHtml(s.key)}" placeholder="G, Am..."></div>
      <div class="formrow"><label>BPM</label><input type="number" id="eBpm" min="40" max="240" value="${s.bpm}"></div>
      <div class="formrow"><label>Ölçü</label><select id="eSig">${['4/4','3/4','6/8','2/4','12/8'].map(t=>`<option ${s.timeSig===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="formrow"><label>Capo</label><select id="eCapo">${Array.from({length:13},(_,i)=>`<option value="${i}" ${s.capo===i?'selected':''}>${i}</option>`).join('')}</select></div>
      <div class="formrow"><label>Ritim</label><select id="eRhythm">${State.rhythms.map(r=>`<option value="${r.id}" ${s.rhythmId===r.id?'selected':''}>${escapeHtml(r.name)}</option>`).join('')}</select></div>
      <div class="formrow"><label>Kategori/Etiketler (virgülle)</label><input type="text" id="eTags" value="${escapeHtml((s.tags||[]).join(', '))}"></div>
    </div>
    <div class="editor-toggle">
      <button class="btn primary" id="modeSimple">🖊 Basit Mod (Söz üzerine tıkla)</button>
      <button class="btn" id="modeAdvanced">⚙ Gelişmiş Mod (ChordPro)</button>
    </div>
    <div id="pasteArea" class="formrow">
      <label>Şarkı sözlerini buraya yapıştırın — akorsuz olabilir, ya da akor satırı sözün tam üstünde olacak şekilde yapıştırırsanız akorlar otomatik yerleşir</label>
      <textarea id="ePaste" rows="6" placeholder="Dm          C           Bb          Am&#10;Bak neler oldu, zor zamanlar bizi buldu"></textarea>
      <button class="btn" id="btnApplyPaste" style="align-self:flex-start;">Sözleri (ve Akorları) Yükle</button>
    </div>
    <div id="editorSimple"><div id="editorLyricArea"></div></div>
    <div id="editorAdvanced" class="hidden"><textarea id="editorAdvancedText"></textarea></div>
    <div class="modal-actions">
      <button class="btn" id="eCancel">İptal</button>
      <button class="btn primary" id="eSave">Kaydet</button>
    </div>
  `);
  function syncAdvancedFromWorking(){ $('#editorAdvancedText',modal).value = serializeChordProBody(workingSections); }
  function syncSimpleFromWorking(){
    $('#editorLyricArea',modal).innerHTML = workingSections.map((sec,si)=>
      `<div class="section-title">${escapeHtml(sec.name)}</div>` +
      sec.lines.map((line,li)=> line.units.length? `<div class="lyric-line">${line.units.map((u,ui)=>
        `<span class="clu" data-sec="${si}" data-line="${li}" data-u="${ui}">${chordTagSpan(u.chord)}<span class="lyricword clickable">${escapeHtml(u.text)||'&nbsp;'}</span></span>`
      ).join('')}</div>` : `<div class="emptyline"></div>`
      ).join('')
    ).join('');
  }
  syncAdvancedFromWorking(); syncSimpleFromWorking();
  if($('#btnGoImport',modal)) $('#btnGoImport',modal).onclick = ()=>{ closeModal(); openImportModal(); };
  $('#modeSimple',modal).onclick = ()=>{ $('#editorSimple',modal).classList.remove('hidden'); $('#editorAdvanced',modal).classList.add('hidden'); syncSimpleFromWorking(); };
  $('#modeAdvanced',modal).onclick = ()=>{
    // pull simple edits into workingSections first (already live), then show advanced text
    $('#editorAdvanced',modal).classList.remove('hidden'); $('#editorSimple',modal).classList.add('hidden');
    syncAdvancedFromWorking();
  };
  $('#btnApplyPaste',modal).onclick = ()=>{
    const txt = $('#ePaste',modal).value;
    if(!txt.trim()) return;
    const {text: converted, hadChordLines} = chordSheetToChordPro(txt);
    const newSections = parseChordProBody(converted);
    workingSections.length=0; workingSections.push(...newSections);
    syncSimpleFromWorking(); syncAdvancedFromWorking();
    toast(hadChordLines ? 'Sözler ve akorlar otomatik yerleştirildi.' : 'Sözler yüklendi. Akor eklemek için kelimeye tıklayın.');
  };
  $('#editorLyricArea',modal).addEventListener('click', e=>{
    const tag = e.target.closest('.chordtag');
    const word = e.target.closest('.lyricword');
    const clu = e.target.closest('.clu');
    if(!clu) return;
    const sec = +clu.dataset.sec, line = +clu.dataset.line, u = +clu.dataset.u;
    if(tag || word){
      const chordName = prompt('Akor gir (örn: G, Am7, D/F#) — boş bırakırsan kaldırılır:', workingSections[sec].lines[line].units[u].chord||'');
      if(chordName===null) return;
      workingSections[sec].lines[line].units[u].chord = chordName.trim() || null;
      syncSimpleFromWorking(); syncAdvancedFromWorking();
    }
  });
  $('#editorAdvancedText',modal).addEventListener('change', e=>{
    const parsed = parseChordProBody(e.target.value);
    workingSections.length=0; workingSections.push(...parsed);
    syncSimpleFromWorking();
  });
  $('#eCancel',modal).onclick = closeModal;
  $('#eSave',modal).onclick = async ()=>{
    const title = $('#eTitle',modal).value.trim();
    if(!title){ toast('Şarkı adı gerekli','err'); return; }
    // ensure latest advanced text parsed if visible
    if(!$('#editorAdvanced',modal).classList.contains('hidden')){
      const parsed = parseChordProBody($('#editorAdvancedText',modal).value);
      workingSections.length=0; workingSections.push(...parsed);
    }
    s.title=title; s.artist=$('#eArtist',modal).value.trim(); s.key=$('#eKey',modal).value.trim()||'C';
    s.bpm=clamp(+$('#eBpm',modal).value||100,40,240); s.timeSig=$('#eSig',modal).value; s.capo=+$('#eCapo',modal).value;
    s.rhythmId=$('#eRhythm',modal).value;
    s.tags = $('#eTags',modal).value.split(',').map(t=>t.trim()).filter(Boolean);
    s.sections = workingSections; s.updated = Date.now();
    await DB.put('songs', s);
    if(isNew) State.songs.push(s); else State.songs = State.songs.map(x=>x.id===s.id?s:x);
    closeModal(); renderSongList(); openSong(s.id);
    toast('Şarkı kaydedildi');
  };
}

async function deleteSong(s){
  if(!confirm(`"${s.title}" silinsin mi?`)) return;
  await DB.delete('songs', s.id);
  State.songs = State.songs.filter(x=>x.id!==s.id);
  State.currentSong = null;
  showView('library'); renderSongList();
  toast('Şarkı silindi');
}

/* =========================================================================
   IMPORT / EXPORT
   ========================================================================= */
function songToChordPro(s){
  return `{title: ${s.title}}\n{artist: ${s.artist||''}}\n{key: ${s.key}}\n{tempo: ${s.bpm}}\n{time: ${s.timeSig}}\n{capo: ${s.capo||0}}\n\n${serializeChordProBody(s.sections)}`;
}
function songToTxt(s){
  return s.sections.map(sec=> `[${sec.name}]\n`+sec.lines.map(l=> l.units.map(u=>u.text).join('')).join('\n')).join('\n\n');
}
function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type:mime||'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
function openExportModal(s){
  const modal = openModal(`<h2>Dışa Aktar: ${escapeHtml(s.title)}</h2>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button class="btn" id="expJson">📄 JSON</button>
      <button class="btn" id="expCpro">🎼 ChordPro (.cho)</button>
      <button class="btn" id="expTxt">📃 TXT</button>
      <button class="btn" id="expPrint">🖨️ Yazdır / PDF</button>
    </div>
    <div class="modal-actions"><button class="btn" id="expClose">Kapat</button></div>`);
  $('#expJson',modal).onclick = ()=> downloadFile(s.title+'.json', JSON.stringify(s,null,2), 'application/json');
  $('#expCpro',modal).onclick = ()=> downloadFile(s.title+'.cho', songToChordPro(s), 'text/plain');
  $('#expTxt',modal).onclick = ()=> downloadFile(s.title+'.txt', songToTxt(s), 'text/plain');
  $('#expPrint',modal).onclick = ()=> printSong(s);
  $('#expClose',modal).onclick = closeModal;
}
function printSong(s){
  const w = window.open('', '_blank');
  const body = s.sections.map(sec=> `<h3>${escapeHtml(sec.name)}</h3><pre style="font-family:inherit;white-space:pre-wrap;">${
    sec.lines.map(l=> l.units.map(u=> (u.chord?`<b style="color:#c2410c">[${escapeHtml(u.chord)}]</b>`:'')+escapeHtml(u.text)).join('')).join('\n')
  }</pre>`).join('');
  w.document.write(`<html><head><title>${escapeHtml(s.title)}</title></head><body style="font-family:sans-serif; padding:30px;">
    <h1>${escapeHtml(s.title)}</h1><p>${escapeHtml(s.artist||'')} — Ton: ${escapeHtml(s.key)} — Capo: ${s.capo||0} — BPM: ${s.bpm} — ${escapeHtml(s.timeSig)}</p>
    ${body}</body></html>`);
  w.document.close(); w.focus(); setTimeout(()=>w.print(), 400);
}
function openImportModal(){
  const modal = openModal(`<h2>Şarkı İçe Aktar</h2>
    <div class="formrow"><label>Dosya seç (.json / .cho / .txt)</label><input type="file" id="impFile" accept=".json,.cho,.txt,.chordpro"></div>
    <div class="formrow"><label>Veya doğrudan yapıştır — ChordPro, düz TXT, ya da akor satırı sözün üstünde olan klasik format (akorlar otomatik yerleşir)</label><textarea id="impPaste" rows="8"></textarea></div>
    <div class="modal-actions"><button class="btn" id="impCancel">İptal</button><button class="btn primary" id="impGo">İçe Aktar</button></div>`);
  $('#impCancel',modal).onclick = closeModal;
  $('#impGo',modal).onclick = async ()=>{
    const file = $('#impFile',modal).files[0];
    let text = $('#impPaste',modal).value;
    if(file) text = await file.text();
    if(!text.trim()){ toast('İçerik boş','err'); return; }
    try{
      let song;
      if(text.trim().startsWith('{') && (file? file.name.endsWith('.json'): false) || (!file && text.trim().startsWith('{') && text.includes('"sections"'))){
        const obj = JSON.parse(text);
        song = makeSong({title:obj.title||'İçe Aktarılan', artist:obj.artist, key:obj.key||'C', bpm:obj.bpm||100, timeSig:obj.timeSig||'4/4', capo:obj.capo||0, body:''});
        song.sections = obj.sections || song.sections;
        // Optional extras a hand-built import can carry so a song comes in fully set up in one
        // shot — chord timing included — instead of needing every gap re-tuned by hand afterward.
        if(obj.chordGaps) song.chordGaps = obj.chordGaps;
        if(obj.chordDuration!=null) song.chordDuration = obj.chordDuration;
        if(obj.scrollSpeed!=null) song.scrollSpeed = obj.scrollSpeed;
        if(obj.rhythmId) song.rhythmId = obj.rhythmId;
        if(obj.tags) song.tags = obj.tags;
        if(obj.genre) song.genre = obj.genre;
        if(obj.notes) song.notes = obj.notes;
        if(obj.album) song.album = obj.album;
      } else {
        // ChordPro or TXT
        const titleM = text.match(/\{title:\s*([^}]+)\}/i);
        const artistM = text.match(/\{artist:\s*([^}]+)\}/i);
        const keyM = text.match(/\{key:\s*([^}]+)\}/i);
        const tempoM = text.match(/\{tempo:\s*([^}]+)\}/i);
        const timeM = text.match(/\{time:\s*([^}]+)\}/i);
        const capoM = text.match(/\{capo:\s*([^}]+)\}/i);
        const {text: converted} = chordSheetToChordPro(text);
        song = makeSong({
          title: (titleM?titleM[1]:'İçe Aktarılan').trim(), artist:(artistM?artistM[1]:'').trim(),
          key:(keyM?keyM[1]:'C').trim(), bpm: tempoM?+tempoM[1]:100, timeSig:(timeM?timeM[1]:'4/4').trim(), capo: capoM?+capoM[1]:0,
          body: converted
        });
      }
      song.id = uid(); song.created=Date.now(); song.updated=Date.now();
      await DB.put('songs', song); State.songs.push(song);
      closeModal(); renderSongList(); openSong(song.id);
      toast('Şarkı içe aktarıldı');
    }catch(err){
      console.error(err); toast('İçe aktarma hatası: dosya bozuk olabilir','err');
    }
  };
}

  renderAdminSection(modal);
  $('#sSave',modal).onclick = ()=>{

    st.defaultBpm=+$('#sBpm',modal).value; st.defaultRhythm=$('#sRhythm',modal).value; st.volume=+$('#sVol',modal).value;

/* =========================================================================
   PERFORMANCE MODE + FULLSCREEN
   ========================================================================= */
function enterPerformanceMode(){
  document.body.classList.add('performance');
  // Performance mode used to force the dark "stage" theme regardless of the user's own choice.
  // It now just keeps whatever theme is already selected (Ayarlar > Tema) — some people want a
  // bright/white stage, not a forced black one.
  toast('Performans modu. Çıkmak için F veya ESC.');
}
function exitPerformanceMode(){
  document.body.classList.remove('performance');
  applySettingsToUI();
}
$('#btnPerformance').addEventListener('click', ()=>{
  if(document.body.classList.contains('performance')) exitPerformanceMode();
  else { if(!State.currentSong){ toast('Önce bir şarkı açın','err'); return;} enterPerformanceMode(); }
});
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}

/* =========================================================================
   KEYBOARD SHORTCUTS
   ========================================================================= */
document.addEventListener('keydown', e=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;
  if(!State.currentSong) return;
  switch(e.key){
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowUp': State.currentSong.bpm=clamp(State.currentSong.bpm+1,40,240); DB.put('songs',State.currentSong); renderSongHeader(); renderTransport(); break;
    case 'ArrowDown': State.currentSong.bpm=clamp(State.currentSong.bpm-1,40,240); DB.put('songs',State.currentSong); renderSongHeader(); renderTransport(); break;
    case 'ArrowLeft': stepChord(-1); break;
    case 'ArrowRight': stepChord(1); break;
    case 'f': case 'F': toggleFullscreen(); break;
    case 'Escape': if(document.body.classList.contains('performance')) exitPerformanceMode(); break;
    case 't': case 'T': State.transpose=clamp(State.transpose+1,-11,11); renderSongHeader(); renderLyrics(); buildTimeline(); break;
    case 'm': case 'M': togglePlay(); break;
  }
});

/* =========================================================================
   MOBILE NAV
   ========================================================================= */
function closeSidebarMobile(){ $('#sidebar').classList.remove('open'); $('#sidebarScrim').classList.remove('show'); }
$('#menuToggle').addEventListener('click', ()=>{ $('#sidebar').classList.toggle('open'); $('#sidebarScrim').classList.toggle('show'); });
$('#sidebarScrim').addEventListener('click', closeSidebarMobile);
$('#rightScrim').addEventListener('click', ()=>{ $('#rightpanel').classList.remove('open'); $('#rightScrim').classList.remove('show'); });

// The off-canvas sidebar/right panel sit just past the right/left edge of the viewport via
// transform so they can slide in. Their geometry still technically extends past the visible
// area, and some mobile browsers respond to a focused form field by auto-scrolling the nearest
// scroll container horizontally into view of that geometry, visibly shifting the whole page
// sideways even though overflow is set to hidden (overflow:hidden blocks user-drag scrolling
// but not this programmatic kind). Forcibly snap back rather than chase the underlying cause
// across every current and future browser quirk.
function snapHorizontalScroll(){
  if(document.documentElement.scrollLeft) document.documentElement.scrollLeft = 0;
  if(document.body.scrollLeft) document.body.scrollLeft = 0;
}
document.addEventListener('scroll', snapHorizontalScroll, {capture:true, passive:true});
window.addEventListener('resize', snapHorizontalScroll, {passive:true});

/* =========================================================================
   INIT
   ========================================================================= */
(async function init(){
  try{
    await loadAll();
    renderSongList();
    showView('library');
  }catch(err){
    console.error(err);
    toast('Veritabanı yüklenemedi: '+err.message, 'err');
  }
})();
</script>
