<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ChordStage — Şarkı Sözü &amp; Akor &amp; Ritim Uygulaması</title>
<meta name="description" content="Offline çalışan gitar odaklı şarkı sözü, akor, ritim ve performans uygulaması">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">
<style>
:root{
  --bg:#f4f5f7; --bg-elev:#ffffff; --bg-elev2:#eef0f3; --border:#dcdfe4;
  --text:#1b1e24; --text-dim:#6b7280; --accent:#3563e9; --accent-2:#1e40af;
  --chord:#c2410c; --chord-bg:#fff2e8;
  --active:#16a34a; --upcoming:#eab308; --next:#2563eb; --past:#9ca3af;
  --danger:#dc2626; --radius:10px; --shadow:0 2px 10px rgba(0,0,0,.08);
  --font-lyrics:1.15rem; --font-chord:1rem;
}
[data-theme="dark"]{
  --bg:#12141a; --bg-elev:#1b1e26; --bg-elev2:#232733; --border:#323846;
  --text:#eef0f4; --text-dim:#98a1b3; --accent:#5c8bff; --accent-2:#3563e9;
  --chord:#ff9a52; --chord-bg:#3a2416;
}
[data-theme="stage"]{
  --bg:#000000; --bg-elev:#0a0a0a; --bg-elev2:#161616; --border:#333;
  --text:#ffffff; --text-dim:#c9c9c9; --accent:#ffd400; --accent-2:#ffae00;
  --chord:#ffd400; --chord-bg:#1c1600;
  --active:#39ff6a; --upcoming:#ffd400; --next:#5cc8ff; --past:#666;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
html{overflow-x:hidden; width:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex; flex-direction:column; height:100vh; overflow:hidden;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
.btn{
  background:var(--bg-elev2); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:8px 14px; font-size:.9rem; min-height:38px;
}
.btn:hover{filter:brightness(1.08);}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
.btn.danger{background:var(--danger); color:#fff; border-color:var(--danger);}
.btn.icon{padding:8px; min-width:38px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.hidden{display:none !important;}
body:not(.is-admin) .admin-only{display:none !important;}
input[type=text],input[type=number],input[type=search],textarea,select{
  background:var(--bg-elev); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:8px 10px; font-size:.9rem;
}
a{color:var(--accent);}

/* ---------- Top bar ---------- */
#topbar{
  display:flex; align-items:center; gap:8px; padding:8px 12px;
  background:var(--bg-elev); border-bottom:1px solid var(--border); flex-shrink:0; z-index:50;
  overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
#topbar::-webkit-scrollbar{display:none;}
#topbar > *{flex-shrink:0;}
#topbar .logo{font-weight:800; font-size:1.05rem; display:flex; align-items:center; gap:6px;}
#topbar .spacer{flex:1;}
#menuToggle{display:none;}
.navbtn{background:transparent;border:none;color:var(--text);padding:8px 10px;border-radius:8px;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px;}
.navbtn.active{background:var(--bg-elev2); color:var(--accent);}
.navbtn span.ic{font-size:1.15rem;}

/* ---------- Layout ---------- */
#appwrap{flex:1; display:flex; min-height:0;}
#sidebar{
  width:280px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow:hidden;
}
#sidebar .sbhead{padding:10px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:8px;}
#sidebar .tabs{display:flex; gap:4px; padding:8px 10px 0; flex-wrap:wrap;}
#sidebar .tabs button{flex:1; min-width:70px; font-size:.75rem; padding:6px 4px;}
#songList{flex:1; overflow-y:auto; padding:6px;}
.songitem{
  padding:8px 10px; border-radius:8px; cursor:pointer; margin-bottom:3px;
  display:flex; justify-content:space-between; align-items:center; gap:6px;
}
.songitem:hover{background:var(--bg-elev2);}
.songitem.selected{background:var(--accent); color:#fff;}
.songitem .meta{font-size:.72rem; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.songitem.selected .meta{color:#e5e9ff;}
.songitem .title{font-weight:600; font-size:.88rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.songitem .fav{background:none;border:none;font-size:1rem;color:var(--text-dim);flex-shrink:0;}
.songitem.selected .fav{color:#fff;}
.taglist{display:flex; flex-wrap:wrap; gap:4px; padding:6px 10px;}
.tagchip{font-size:.7rem; padding:3px 8px; border-radius:99px; background:var(--bg-elev2); border:1px solid var(--border); cursor:pointer;}
.tagchip.active{background:var(--accent); color:#fff; border-color:var(--accent);}

#main{flex:1; display:flex; min-width:0; overflow:hidden;}
#center{flex:1; display:flex; flex-direction:column; min-width:0; overflow:hidden;}
#rightpanel{
  width:280px; flex-shrink:0; background:var(--bg-elev); border-left:1px solid var(--border);
  overflow-y:auto; padding:12px;
}

/* ---------- Song header ---------- */
#songHeader{padding:10px 18px; border-bottom:1px solid var(--border); background:var(--bg-elev); flex-shrink:0;}
#songHeader h1{margin:0; font-size:1.4rem; transition:font-size .2s;}
#songHeader .artist{color:var(--text-dim); font-size:.95rem; margin-top:2px; transition:max-height .2s, opacity .2s;}
.infobar{display:flex; flex-wrap:nowrap; gap:6px; margin-top:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px; transition:max-height .2s, opacity .2s, margin .2s;}
.infobar::-webkit-scrollbar{display:none;}
.pill{background:var(--bg-elev2); border:1px solid var(--border); border-radius:99px; padding:4px 12px; font-size:.8rem; display:flex; align-items:center; gap:4px; flex-shrink:0; white-space:nowrap;}
.pill button{background:none;border:none;color:var(--text); font-size:.9rem; padding:0 2px;}
/* Collapsed while playing: the now-playing strip already surfaces the chord/flow info that
   matters mid-performance, so the static header (title, editing buttons, every info pill)
   shrinks to near-nothing to give the lyrics the vertical space they actually need. */
#songHeader.compact{padding-top:6px; padding-bottom:6px;}
#songHeader.compact h1{font-size:1rem;}
#songHeader.compact .artist{max-height:0; opacity:0; margin:0; overflow:hidden;}
#songHeader.compact .editbtns{display:none;}
#songHeader.compact .infobar{max-height:0; opacity:0; margin:0; overflow:hidden; padding:0;}
#btnCollapseHeader{font-size:.75rem;}
@media (max-width:900px){
  #songHeader{padding:8px 14px;}
  #songHeader h1{font-size:1.15rem;}
  .pill{padding:3px 9px; font-size:.74rem;}
  #nowPlaying{padding:6px 12px; gap:8px;}
  .chordflow{gap:8px;}
  .chordflow .cf-box.now{transform:scale(1.15);}
  .chordflow .cf-box .cname{font-size:1.15rem;}
  .chordflow .cf-box .lbl{font-size:.55rem;}
  .chordflow .arrow{font-size:1rem;}
  #timelineWrap{display:none;} /* tiny, illegible segments on a phone; chordflow above already shows what matters */
}
.pill select{background:none; border:none; color:var(--text); font-size:.8rem;}

/* ---------- Lyrics area ---------- */
/* No CSS scroll-behavior:smooth here: the auto-scroll during playback (autoScrollStep) already
   eases toward its target every frame in JS, and combining that with the browser's own smooth-
   scroll animation on top of it re-triggers a new competing animation on every tiny increment,
   which is what caused the visible jitter/tremor while scrolling. The couple of explicit
   scrollIntoView() calls elsewhere pass behavior:'smooth' directly, which works regardless of
   this CSS property. */
#lyricsWrap{flex:1; overflow-y:auto; padding:20px 24px 120px;}
.section-block{margin-bottom:22px;}
.section-title{
  font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--accent);
  font-weight:700; margin-bottom:6px; border-left:3px solid var(--accent); padding-left:8px;
  display:flex; align-items:center; gap:6px;
}
.section-title .repeat-badge{background:var(--accent); color:#fff; border-radius:99px; padding:1px 8px; font-size:.68rem;}
.section-title .repeat-edit{min-width:24px; min-height:24px; padding:2px; font-size:.75rem;}
.lyric-line{
  display:block; line-height:1.5; font-size:var(--font-lyrics); margin-bottom:2px;
}
/* Each word is a small column: a chord "slot" row on top, the word itself below. The slot is
   always rendered — even empty, as an invisible placeholder — so every word reserves the same
   height and lines up on one baseline, and critically, the chord chip is a normal (non-absolute)
   box that takes up real horizontal space. Two chords placed right next to each other (no lyric
   text between a quick change) used to float free of the layout and visually overlap whatever
   came next; now each one pushes the next word over like any other inline content would. */
.clu{position:relative; display:inline-flex; flex-direction:column; align-items:flex-start; vertical-align:bottom; margin-right:2px;}
.clu .lyricword{white-space:pre-wrap; cursor:text;}
.clu .chordtag{
  color:var(--chord); background:var(--chord-bg); font-weight:800;
  font-size:var(--font-chord); line-height:1.15; cursor:pointer; user-select:none; padding:1px 6px 2px;
  border-radius:5px; white-space:nowrap; border:1px solid var(--chord-bg); box-shadow:0 1px 2px rgba(0,0,0,.08);
  margin-bottom:2px; align-self:flex-start;
}
.clu .chordtag.chordtag-empty{visibility:hidden;}
.clu .chordtag:hover{filter:brightness(1.1);}
.clu .lyricword.clickable{cursor:pointer; border-bottom:1px dashed transparent;}
.clu .lyricword.clickable:hover{border-bottom:1px dashed var(--accent);}
.clu.playing-chord{z-index:3;}
/* Scale from the bottom-left corner (not font-size/padding) so the enlarged badge grows
   upward/rightward on top of neighboring content (transforms don't affect layout) instead of
   shoving the lyric line itself around. */
.clu.playing-chord .chordtag{
  background:var(--active); color:#fff; border-color:var(--active);
  transform:scale(1.3); transform-origin:bottom left; box-shadow:0 3px 8px rgba(0,0,0,.25); position:relative; z-index:4;
}
.clu.playing-chord .lyricword{font-weight:800; text-decoration:underline; text-decoration-color:var(--active); text-decoration-thickness:3px; text-underline-offset:4px;}
.clu.upcoming-chord .chordtag{background:var(--upcoming); color:#000; border-color:var(--upcoming);}
.emptyline{height:1.2em;}

/* ---------- Now playing strip ---------- */
#nowPlaying{
  display:none; padding:10px 18px; background:var(--bg-elev2); border-bottom:1px solid var(--border);
  align-items:center; gap:18px; flex-wrap:wrap;
}
#nowPlaying.show{display:flex;}
.chordflow{display:flex; align-items:center; gap:14px;}
.chordflow .cf-box{text-align:center; opacity:.55; transition:all .25s;}
.chordflow .cf-box.now{opacity:1; transform:scale(1.35); font-weight:800;}
.chordflow .cf-box .lbl{font-size:.62rem; text-transform:uppercase; color:var(--text-dim); letter-spacing:.05em;}
.chordflow .cf-box .cname{font-size:1.6rem; font-weight:800; color:var(--active);}
.chordflow .cf-box.next .cname{color:var(--next);}
.chordflow .cf-box.prev .cname{color:var(--past);}
.chordflow .arrow{color:var(--text-dim); font-size:1.3rem;}
#timelineWrap{flex:1; min-width:200px;}
#timelineBar{position:relative; height:34px; background:var(--bg-elev); border:1px solid var(--border); border-radius:8px; overflow:hidden;}
.tl-seg{position:absolute; top:0; bottom:0; border-right:1px solid var(--border); font-size:.65rem; display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; overflow:hidden;}
.tl-seg:hover{background:var(--bg-elev2);}
.tl-seg.active{background:var(--active); color:#fff; font-weight:700;}
#tlCursor{position:absolute; top:0; bottom:0; width:2px; background:var(--danger); pointer-events:none;}

/* ---------- Transport ---------- */
#transport{
  display:flex; align-items:center; gap:10px; padding:10px 18px; background:var(--bg-elev);
  border-top:1px solid var(--border); flex-wrap:wrap;
}
#transport .grow{flex:1;}
.bpmdisplay{font-variant-numeric:tabular-nums; font-weight:700; min-width:70px; text-align:center;}
#beatDots{display:flex; gap:5px;}
.beatdot{width:12px; height:12px; border-radius:50%; background:var(--bg-elev2); border:1px solid var(--border);}
.beatdot.on{background:var(--accent);}
.beatdot.on.first{background:var(--danger);}

/* ---------- Right panel: chord detail ---------- */
.chordDetailTitle{font-size:1.4rem; font-weight:800; text-align:center; margin-bottom:6px;}
#chordSvgHolder{display:flex; justify-content:center; margin-bottom:8px;}
.altRow{display:flex; gap:8px; overflow-x:auto; padding:4px 0;}
.altRow .altchip{flex-shrink:0; text-align:center; cursor:pointer; padding:4px; border-radius:8px; border:1px solid transparent;}
.altRow .altchip:hover{border-color:var(--accent);}
.stringinfo{font-size:.75rem; font-family:monospace; background:var(--bg-elev2); padding:8px; border-radius:8px; margin-top:6px; white-space:pre;}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center;
  z-index:200; padding:16px;
}
.modal{
  background:var(--bg-elev); border-radius:12px; max-width:640px; width:100%; max-height:90vh; overflow-y:auto;
  padding:20px; box-shadow:var(--shadow);
}
.modal h2{margin-top:0;}
.formrow{display:flex; flex-direction:column; gap:4px; margin-bottom:12px;}
.formrow label{font-size:.78rem; color:var(--text-dim); font-weight:600;}
.formgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.modal-actions{
  display:flex; justify-content:flex-end; gap:8px; margin-top:16px;
  position:sticky; bottom:-20px; margin-left:-20px; margin-right:-20px;
  padding:12px 20px 20px; background:var(--bg-elev); border-top:1px solid var(--border); z-index:5;
}

/* chord picker popover */
#chordPicker{
  position:fixed; z-index:300; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px;
  box-shadow:var(--shadow); padding:8px; width:260px; max-height:340px; overflow-y:auto;
}
#chordPicker input{width:100%; margin-bottom:6px;}
#chordPicker .cp-item{padding:6px 8px; border-radius:6px; cursor:pointer; font-size:.88rem;}
#chordPicker .cp-item:hover{background:var(--bg-elev2);}
#chordPicker .cp-remove{color:var(--danger); border-top:1px solid var(--border); margin-top:4px; padding-top:8px;}

#beatPopover{
  position:fixed; z-index:300; background:var(--bg-elev); border:1px solid var(--border); border-radius:10px;
  box-shadow:var(--shadow); padding:8px 10px; display:flex; align-items:center; gap:8px;
}
#beatPopover .bp-chord{color:var(--chord); font-weight:800;}
#beatPopover button{min-width:32px; min-height:32px; padding:4px;}
#beatPopover .bp-val{min-width:52px; text-align:center; font-weight:700;}

/* editor */
#editorLyricArea{border:1px solid var(--border); border-radius:8px; padding:14px; min-height:200px; background:var(--bg-elev2); line-height:2.4em;}
#editorAdvancedText{width:100%; min-height:260px; font-family:monospace; font-size:.9rem;}
.editor-toggle{display:flex; gap:6px; margin-bottom:10px;}

/* performance mode */
body.performance #topbar,body.performance #sidebar,body.performance #rightpanel,body.performance #songHeader .infobar .editbtns{display:none !important;}
body.performance #main{width:100%;}
body.performance #lyricsWrap{font-size:1.4em; padding:30px 40px 160px;}
body.performance{background:#000;}
body.performance:not([data-theme]) , body.performance{}
body.performance #songHeader h1{font-size:2rem;}

/* rhythm strip visual */
.rhythm-visual{display:flex; gap:6px; font-size:1.3rem; justify-content:center; padding:6px;}
.rhythm-visual span.beatActive{color:var(--accent); font-weight:900; transform:scale(1.3); display:inline-block;}

/* setlist */
.setlistItem{display:flex; align-items:center; gap:8px; padding:8px; border:1px solid var(--border); border-radius:8px; margin-bottom:6px; background:var(--bg-elev2); cursor:grab;}
.setlistItem .num{font-weight:800; color:var(--text-dim); width:20px;}

/* toast */
#toast{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#111; color:#fff; padding:10px 18px; border-radius:8px; font-size:.85rem; z-index:500; opacity:0; transition:opacity .3s; pointer-events:none;}
#toast.show{opacity:1;}

/* responsive */
@media (max-width:900px){
  #sidebar{position:fixed; top:56px; bottom:0; left:0; width:82%; max-width:320px; transform:translateX(-100%); transition:transform .25s; z-index:100;}
  #sidebar.open{transform:translateX(0);}
  #rightpanel{position:fixed; top:56px; bottom:0; right:0; width:82%; max-width:320px; transform:translateX(100%); transition:transform .25s; z-index:100;}
  #rightpanel.open{transform:translateX(0);}
  #menuToggle{display:flex;}
  .navbtn span.label{display:none;}
  .navbtn{min-width:42px; padding:8px 6px;}
  #topbar .logo .logo-text{display:none;}
  #sidebarScrim,#rightScrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:90;}
  #sidebarScrim.show,#rightScrim.show{display:block;}
}
@media (max-width:600px){
  .formgrid{grid-template-columns:1fr;}
  #transport{gap:6px;}
}
</style>
</head>
<body>

<div id="topbar">
  <button class="btn icon" id="menuToggle" title="Menü">☰</button>
  <div class="logo">🎸 <span class="logo-text">ChordStage</span></div>
  <button class="navbtn active" data-view="library"><span class="ic">🏠</span><span class="label">Ana Sayfa</span></button>
  <button class="navbtn" data-view="chordlib"><span class="ic">🎼</span><span class="label">Akorlar</span></button>
  <button class="navbtn" data-view="rhythmlib"><span class="ic">🥁</span><span class="label">Ritimler</span></button>
  <button class="navbtn" data-view="setlists"><span class="ic">📋</span><span class="label">Setlist</span></button>
  <div class="spacer"></div>
  <button class="btn icon admin-only" id="btnNewSong" title="Yeni Şarkı">➕</button>
  <button class="btn icon" id="btnPerformance" title="Performans Modu">🎤</button>
  <button class="btn icon" id="btnSettings" title="Ayarlar">⚙️</button>
</div>

<div id="sidebarScrim"></div>
<div id="rightScrim"></div>

<div id="appwrap">
  <div id="sidebar">
    <div class="sbhead">
      <input type="search" id="searchBox" placeholder="Şarkı, sanatçı, ton, etiket ara...">
      <div style="display:flex; gap:6px;">
        <button class="btn" id="filterFav" style="flex:1;">⭐ Favoriler</button>
        <button class="btn" id="filterRecent" style="flex:1;">🕒 Son</button>
      </div>
    </div>
    <div class="taglist" id="categoryTags"></div>
    <div id="songList"></div>
  </div>

  <div id="main">
    <div id="center">
      <div id="viewLibraryEmpty" style="flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--text-dim); padding:20px; text-align:center;">
        <div style="font-size:3rem;">🎵</div>
        <div>Başlamak için soldan bir şarkı seç<span class="admin-only"> ya da yeni şarkı oluştur</span>.</div>
        <button class="btn primary admin-only" id="btnNewSongEmpty">➕ Yeni Şarkı Ekle</button>
        <button class="btn" id="btnOpenLibraryEmpty">📚 Şarkı Kütüphanesini Aç</button>
      </div>

      <div id="viewSong" class="hidden" style="display:flex; flex-direction:column; flex:1; min-height:0;">
        <div id="songHeader"></div>
        <div id="nowPlaying">
          <div class="chordflow" id="chordFlow"></div>
          <div id="timelineWrap"><div id="timelineBar"><div id="tlCursor"></div></div></div>
        </div>
        <div id="lyricsWrap"></div>
        <div id="transport"></div>
      </div>

      <div id="viewChordLib" class="hidden" style="flex:1; overflow-y:auto; padding:16px;">
        <h2>Akor Kütüphanesi</h2>
        <input type="search" id="chordLibSearch" placeholder="Akor ara (örn: Am7)" style="width:260px; margin-bottom:12px;">
        <div id="chordLibGrid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:14px;"></div>
      </div>

      <div id="viewRhythmLib" class="hidden" style="flex:1; overflow-y:auto; padding:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>Ritim Kütüphanesi</h2>
          <button class="btn primary" id="btnNewRhythm">➕ Yeni Ritim</button>
        </div>
        <div id="rhythmGrid" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>

      <div id="viewSetlists" class="hidden" style="flex:1; overflow-y:auto; padding:16px; display:flex; gap:20px;">
        <div style="width:260px; flex-shrink:0;">
          <button class="btn primary" id="btnNewSetlist" style="width:100%; margin-bottom:10px;">➕ Yeni Setlist</button>
          <div id="setlistNames"></div>
        </div>
        <div id="setlistDetail" style="flex:1;"></div>
      </div>
    </div>

    <div id="rightpanel">
      <div id="chordDetailEmpty" style="color:var(--text-dim); text-align:center; padding-top:40px;">Bir akora tıklayın</div>
      <div id="chordDetail" class="hidden"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="modalRoot"></div>
<div id="chordPicker" class="hidden"></div>
<div id="beatPopover" class="hidden"></div>

<script>
"use strict";
/* =========================================================================
   UTILITIES
   ========================================================================= */
const $ = (sel,root)=> (root||document).querySelector(sel);

/* =========================================================================
   MUSIC THEORY / TRANSPOSE
   ========================================================================= */
const NOTE_TO_INDEX = {C:0,'B#':0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,Fb:4,F:5,'E#':5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11,Cb:11};
const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLAT_KEYS = new Set(['F','Bb','Eb','Ab','Db','Gb','Cb','Dm','Gm','Cm','Fm','Bbm','Ebm']);

function noteIndex(note){ return NOTE_TO_INDEX[note]; }
function noteName(idx, useFlats){ idx=((idx%12)+12)%12; return (useFlats?FLAT_NAMES:SHARP_NAMES)[idx]; }

// Parses "Am7", "G/B", "C#maj7" etc into {root, quality, bass}
const CHORD_RE = /^([A-G](?:#|b)?)([^\/]*)(?:\/([A-G](?:#|b)?))?$/;
function parseChordName(name){
  if(!name) return null;
  const m = CHORD_RE.exec(name.trim());
  if(!m) return null;
  return {root:m[1], quality:m[2]||'', bass:m[3]||null};
}
function transposeChordName(name, semitones, useFlats){
  const p = parseChordName(name);
  if(!p) return name;
  const ri = noteIndex(p.root);
  if(ri==null) return name;
  let out = noteName(ri+semitones, useFlats) + p.quality;
  if(p.bass){
    const bi = noteIndex(p.bass);
    if(bi!=null) out += '/'+noteName(bi+semitones, useFlats);
  }
  return out;
}
function keyPrefersFlats(key){
  if(!key) return false;
  return FLAT_KEYS.has(key.replace(/m$/,'').length && key);
}

// CAGED-style generic templates for computed fallback (root-relative, base index = open root note position)
const GEN_TEMPLATES = {
  E:{base:4, tmpl:{maj:[0,2,2,1,0,0], min:[0,2,2,0,0,0], '7':[0,2,0,1,0,0], maj7:[0,2,1,1,0,0], m7:[0,2,0,0,0,0], sus4:[0,2,2,2,0,0], '6':[0,2,2,1,2,0]}},
  A:{base:9, tmpl:{maj:[-1,0,2,2,2,0], min:[-1,0,2,2,1,0], '7':[-1,0,2,0,2,0], maj7:[-1,0,2,1,2,0], m7:[-1,0,2,0,1,0], sus2:[-1,0,2,2,0,0], sus4:[-1,0,2,2,3,0], '6':[-1,0,2,2,2,2], m6:[-1,0,2,2,1,2], dim:[-1,0,1,2,1,-1], aug:[-1,0,3,2,2,1], add9:[-1,0,2,4,2,0], '9':[-1,0,2,0,2,2]}}
};
function normalizeQuality(q){
  q = (q||'').trim();
  if(q==='' ) return 'maj';
  if(/^(m|min)$/.test(q)) return 'min';
  if(/^(maj7|M7|Δ7?)$/.test(q)) return 'maj7';
  if(/^(m7|min7)$/.test(q)) return 'm7';
  if(/^(7)$/.test(q)) return '7';
  if(/^(sus2)$/.test(q)) return 'sus2';
  if(/^(sus4|sus)$/.test(q)) return 'sus4';
  if(/^(dim|°|o)$/.test(q)) return 'dim';
  if(/^(aug|\+)$/.test(q)) return 'aug';
  if(/^(6)$/.test(q)) return '6';
  if(/^(m6|min6)$/.test(q)) return 'm6';
  if(/^(add9)$/.test(q)) return 'add9';
  if(/^(9)$/.test(q)) return '9';
  if(/^(maj9|M9)$/.test(q)) return 'maj7';
  if(/^(m9|min9)$/.test(q)) return 'm7';
  if(/^(11)$/.test(q)) return '7';
  if(/^(13)$/.test(q)) return '7';
  return 'maj';
}
function fingersFromFrets(frets){
  const fretted = frets.filter(f=>f>0);
  if(!fretted.length) return frets.map(()=>0);
  const uniq = [...new Set(fretted)].sort((a,b)=>a-b);
  return frets.map(f=> f>0 ? uniq.indexOf(f)+1 : 0);
}
// returns {frets:[6], fingers:[6], baseFret, barre, computed:bool}
function getChordShape(name){
  if(!name) return null;
  if(CHORD_SHAPES[name]){
    const s = CHORD_SHAPES[name];
    return {frets:s.frets.slice(), fingers: s.fingers || fingersFromFrets(s.frets), baseFret: s.baseFret||1, barre:s.barre||null, computed:false};
  }
  const parsed = parseChordName(name);
  if(!parsed) return null;
  const root = noteIndex(parsed.root);
  if(root==null) return null;
  const qual = normalizeQuality(parsed.quality);
  // choose E or A shape template, prefer smaller shift
  const shiftE = ((root - GEN_TEMPLATES.E.base)%12+12)%12;
  const shiftA = ((root - GEN_TEMPLATES.A.base)%12+12)%12;
  let fam, shift;
  const eHas = GEN_TEMPLATES.E.tmpl[qual];
  const aHas = GEN_TEMPLATES.A.tmpl[qual];
  if(eHas && (!aHas || shiftE<=shiftA)){ fam='E'; shift=shiftE; }
  else if(aHas){ fam='A'; shift=shiftA; }
  else { fam='E'; shift=shiftE; }
  const tmpl = GEN_TEMPLATES[fam].tmpl[qual] || GEN_TEMPLATES[fam].tmpl.maj;
  let frets = tmpl.map(f=> f<0 ? -1 : f+shift);
  let baseFret = 1;
  const maxFret = Math.max(...frets);
  if(maxFret>4){ baseFret = Math.min(...frets.filter(f=>f>0)); frets = frets.map(f=> f>0? f-baseFret+1 : f); }
  return {frets, fingers: fingersFromFrets(frets), baseFret, barre: shift>0?1:null, computed:true};
}
function chordAlternates(name){
  // returns up to 2 alternates: open (if exists literal) + computed CAGED, or simple fret-shift variant
  const alts = [];
  const main = getChordShape(name);
  if(!main) return alts;
  alts.push(main);
  const parsed = parseChordName(name);
  if(parsed){
    const root = noteIndex(parsed.root);
    const qual = normalizeQuality(parsed.quality);
    const shiftA = ((root - GEN_TEMPLATES.A.base)%12+12)%12;
    const shiftE = ((root - GEN_TEMPLATES.E.base)%12+12)%12;
    ['A','E'].forEach(fam=>{
      const tmpl = GEN_TEMPLATES[fam].tmpl[qual];
      if(!tmpl) return;
      const shift = fam==='A'?shiftA:shiftE;
      let frets = tmpl.map(f=> f<0?-1:f+shift);
      let baseFret=1;
      const maxFret = Math.max(...frets);
      if(maxFret>4){ baseFret = Math.min(...frets.filter(f=>f>0)); frets=frets.map(f=>f>0?f-baseFret+1:f); }
      const key = frets.join(',')+baseFret;
      if(!alts.some(a=> a.frets.join(',')+a.baseFret === key)){
        alts.push({frets, fingers:fingersFromFrets(frets), baseFret, barre: shift>0?1:null, computed:true});
      }
    });
  }
  return alts.slice(0,3);
}
// String frequencies (standard tuning) E2 A2 D3 G3 B3 e4
const OPEN_STRING_FREQ = [82.41, 110.00, 146.83, 196.00, 246.94, 329.63];
function shapeToFrequencies(shape){
  return shape.frets.map((f,i)=>{
    if(f===-1) return null;
    const actualFret = f===0?0:(f + (shape.baseFret-1));
    return OPEN_STRING_FREQ[i] * Math.pow(2, actualFret/12);
  });
}

/* SVG chord diagram renderer */
function renderChordSVG(name, shape, size){
  size = size || 130;
  if(!shape) return '<div style="font-size:.8rem;color:var(--text-dim)">Akor bulunamadı</div>';
  const W = size, H = size*1.15;
  const left=24, top=28, right=W-14, bottom=H-14;
  const stringGap = (right-left)/5;
  const fretCount = 4;
  const fretGap = (bottom-top)/fretCount;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${size}" height="${size*1.15}" role="img" aria-label="${escapeHtml(name)} akor diyagramı">`;
  // nut or base fret label
  if(shape.baseFret>1){
    svg += `<text x="${left-16}" y="${top+fretGap*0.75}" font-size="11" fill="currentColor">${shape.baseFret}fr</text>`;
  } else {
    svg += `<rect x="${left-1.5}" y="${top-3}" width="${right-left+3}" height="4" fill="currentColor"/>`;
  }
  // strings
  for(let i=0;i<6;i++){
    const x = left + i*stringGap;
    svg += `<line x1="${x}" y1="${top}" x2="${x}" y2="${bottom}" stroke="currentColor" stroke-width="1.4" opacity="0.7"/>`;
  }
  // frets
  for(let f=0; f<=fretCount; f++){
    const y = top + f*fretGap;
    svg += `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" stroke="currentColor" stroke-width="${f===0&&shape.baseFret===1?0:1}" opacity="0.5"/>`;
  }
  // barre
  if(shape.barre){
    const fretted = shape.frets.map((f,i)=>({f,i})).filter(o=>o.f===shape.barre);
    if(fretted.length>1){
      const minI = Math.min(...fretted.map(o=>o.i)), maxI = Math.max(...fretted.map(o=>o.i));
      const y = top + (shape.barre-0.5)*fretGap;
      svg += `<rect x="${left+minI*stringGap-6}" y="${y-6}" width="${(maxI-minI)*stringGap+12}" height="12" rx="6" fill="currentColor" opacity="0.85"/>`;
    }
  }
  // finger dots + open/mute markers
  shape.frets.forEach((f,i)=>{
    const x = left + i*stringGap;
    if(f===-1){
      svg += `<text x="${x}" y="${top-9}" font-size="12" text-anchor="middle" fill="currentColor">✕</text>`;
    } else if(f===0){
      svg += `<circle cx="${x}" cy="${top-9}" r="4.5" fill="none" stroke="currentColor" stroke-width="1.4"/>`;
    } else {
      const y = top + (f-0.5)*fretGap;
      svg += `<circle cx="${x}" cy="${y}" r="8" fill="var(--accent,#3563e9)"/>`;
      const fg = shape.fingers ? shape.fingers[i] : 0;
      if(fg) svg += `<text x="${x}" y="${y+3.5}" font-size="9.5" text-anchor="middle" fill="#fff">${fg}</text>`;
    }
  });
  svg += '</svg>';
  return svg;
}

/* =========================================================================
   "CHORD ABOVE LYRIC" SHEET AUTO-DETECTION
   Users often paste songs in the classic tab-site layout:
       Dm          C           Bb          Am
       Bak neler oldu, zor zamanlar bizi buldu
   Detect lines that consist only of chord tokens, and fold them into the
   line below at the same column position, producing normal [Chord]word
   ChordPro text — so the user never has to know ChordPro exists.
   ========================================================================= */
const CHORD_TOKEN_RE = /^[A-G](#|b)?(maj7|maj9|m7b5|madd9|min7|min|m7|m9|m6|m|sus2|sus4|sus|add9|dim7|dim|aug|6\/9|6|7sus4|7|9|11|13|5)?(\/[A-G](#|b)?)?$/i;
function isChordLine(line){
  const trimmed = line.trim();
  if(!trimmed) return false;
  const tokens = trimmed.split(/\s+/);
  return tokens.every(t=> CHORD_TOKEN_RE.test(t));
}
function mergeChordLyricLine(chordLine, lyricLine){
  const chordMatches = [];
  { const re=/\S+/g; let m; while((m=re.exec(chordLine))) chordMatches.push({chord:m[0], col:m.index, end:m.index+m[0].length}); }
  if(!chordMatches.length) return lyricLine;
  const wordMatches = [];
  { const re=/\S+/g; let m; while((m=re.exec(lyricLine))) wordMatches.push({start:m.index, end:m.index+m[0].length}); }
  if(!wordMatches.length) return chordMatches.map(c=>`[${c.chord}]`).join(' ');
  // Chord-line spacing copy/pasted through chat or different fonts rarely lines up column-for-
  // column with the lyric line below it. Scale each chord's column proportionally against the
  // extent of both lines, then snap it to the nearest word start (moving left-to-right, never
  // backwards) instead of inserting at the literal character offset — which can otherwise land
  // mid-word.
  const chordExtent = Math.max(...chordMatches.map(c=>c.end));
  const lyricExtent = wordMatches[wordMatches.length-1].end;
  const scale = chordExtent>0 ? lyricExtent/chordExtent : 1;
  const byWord = new Map(); // wordIndex -> [chords in order]
  let cursor = 0;
  chordMatches.forEach(cm=>{
    const target = cm.col*scale;
    let bestIdx = cursor, bestDist = Infinity;
    for(let i=cursor;i<wordMatches.length;i++){
      const d = Math.abs(wordMatches[i].start-target);
      if(d<bestDist){ bestDist=d; bestIdx=i; }
      else if(wordMatches[i].start>target) break;
    }
    if(!byWord.has(bestIdx)) byWord.set(bestIdx, []);
    byWord.get(bestIdx).push(cm.chord);
    cursor = bestIdx;
  });
  let line = lyricLine;
  const order = [...byWord.keys()].sort((a,b)=> b-a); // insert right-to-left so earlier offsets stay valid
  order.forEach(idx=>{
    const tag = byWord.get(idx).map(c=>`[${c}]`).join('');
    const pos = wordMatches[idx].start;
    line = line.slice(0,pos) + tag + line.slice(pos);
  });
  return line;
}
function chordSheetToChordPro(text){
  const raw = (text||'').replace(/\r\n/g,'\n').split('\n');
  const out = [];
  let i = 0;
  let foundAny = false;
  while(i < raw.length){
    const line = raw[i];
    if(line.trim()==='' ){ out.push(''); i++; continue; }
    if(isChordLine(line)){
      foundAny = true;
      const next = raw[i+1];
      if(next!==undefined && next.trim()!=='' && !isChordLine(next)){
        out.push(mergeChordLyricLine(line, next));
        i += 2;
      } else {
        out.push(line.trim().split(/\s+/).map(c=>`[${c}]`).join(' '));
        i += 1;
      }
    } else {
      out.push(line);
      i += 1;
    }
  }
  return {text: out.join('\n'), hadChordLines: foundAny};
}

/* =========================================================================
   CHORDPRO-LIKE PARSING  ([Chord]lyric text, {section: name} lines)
   ========================================================================= */
function splitRunIntoWordUnits(chord, text){
  if(text===''){ return [{chord, text}]; }
  const leading = text.match(/^\s*/)[0];
  const rest = text.slice(leading.length);
  if(rest===''){ return [{chord, text}]; } // whitespace-only run (e.g. spacing before an instrumental chord)
  const words = rest.match(/\S+\s*/g) || [rest];
  return words.map((w,i)=> ({chord: i===0?chord:null, text: i===0?leading+w:w}));
}
function parseChordProBody(text){
  const lines = (text||'').replace(/\r\n/g,'\n').split('\n');
  const sections = [];
  let current = {name:'Verse', lines:[]};
  sections.push(current);
  const sectionRe = /^\{(?:section:|start_of_)?\s*([^}]+?)\}$/i;
  lines.forEach(raw=>{
    const line = raw.trim();
    const secM = line.match(sectionRe);
    if(secM){
      current = {name: secM[1].trim(), lines:[]};
      sections.push(current);
      return;
    }
    if(/^\{.*\}$/.test(line)) return; // ignore other directives (title/artist etc, handled separately)
    // parse chord markers
    const units = [];
    const re = /\[([^\]]+)\]/g;
    let lastIndex = 0, m, pendingChord=null;
    if(!re.test(raw)){ /* reset lastIndex */ }
    re.lastIndex = 0;
    let out = [];
    let idx = 0;
    while((m = re.exec(raw))){
      const textBefore = raw.slice(idx, m.index);
      // Push even when textBefore is empty as long as a chord is already pending — two
      // adjacent markers like [C][Bb]word are a real (if quick) chord change and must not
      // silently drop the first one just because there's no lyric text between them.
      if(textBefore || pendingChord!==null) out.push({chord:pendingChord, text:textBefore});
      pendingChord = m[1];
      idx = re.lastIndex;
    }
    const rest = raw.slice(idx);
    out.push({chord:pendingChord, text:rest});
    // Split each chord/text run into one unit per word. A chord historically "held" over
    // however many words happened to sit in the same run (whatever text followed it up to the
    // next marker) — visually fine for reading, but it meant clicking any word in that run
    // could only edit the chord for the *whole* run, not that one word. Word-level units keep
    // the exact same rendering (only the run's own chord is shown, on its first word; later
    // words carry chord:null and show nothing, unchanged) while making every single word its
    // own independently clickable/editable target.
    const wordUnits = [];
    out.forEach(u=> wordUnits.push(...splitRunIntoWordUnits(u.chord, u.text)));
    current.lines.push({raw, units: wordUnits});
  });
  return sections.filter(s=>s.lines.length || sections.length===1);
}
function serializeChordProBody(sections){
  let out = [];
  sections.forEach(sec=>{
    out.push(`{section: ${sec.name}}`);
    sec.lines.forEach(line=>{
      out.push(line.units.map(u=> (u.chord? `[${u.chord}]`:'') + u.text).join(''));
    });
  });
  return out.join('\n');
}
function extractAllChords(sections){
  const set = [];
  sections.forEach(sec=> sec.lines.forEach(line=> line.units.forEach(u=>{
    if(u.chord && !set.includes(u.chord)) set.push(u.chord);
  })));
  return set;
}
function transposeSections(sections, semitones, useFlats){
  return sections.map(sec=>({
    name:sec.name,
    repeat:sec.repeat,
    lines: sec.lines.map(line=>({
      raw: line.raw,
      units: line.units.map(u=> ({chord: u.chord? transposeChordName(u.chord, semitones, useFlats): u.chord, text:u.text}))
    }))
  }));
}

/* =========================================================================
   INDEXEDDB (promise-based)
   ========================================================================= */
const DB = (()=>{
  const DB_NAME='chordstage', DB_VER=1;
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((resolve,reject)=>{
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = e=>{
        const db = e.target.result;
        if(!db.objectStoreNames.contains('songs')) db.createObjectStore('songs',{keyPath:'id'});
        if(!db.objectStoreNames.contains('setlists')) db.createObjectStore('setlists',{keyPath:'id'});
        if(!db.objectStoreNames.contains('rhythms')) db.createObjectStore('rhythms',{keyPath:'id'});
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return dbp;
  }
  async function tx(store, mode){ const db = await open(); return db.transaction(store, mode).objectStore(store); }
  return {
    async getAll(store){
      try{
        const os = await tx(store,'readonly');
        return await new Promise((res,rej)=>{ const r=os.getAll(); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
      }catch(e){ console.error('DB getAll',e); return []; }
    },
    async get(store,id){
      const os = await tx(store,'readonly');
      return await new Promise((res,rej)=>{ const r=os.get(id); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
    },
    async put(store,obj){
      const os = await tx(store,'readwrite');
      return await new Promise((res,rej)=>{ const r=os.put(obj); r.onsuccess=()=>res(obj); r.onerror=()=>rej(r.error); });
    },
    async delete(store,id){
      const os = await tx(store,'readwrite');
      return await new Promise((res,rej)=>{ const r=os.delete(id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
    }
  };
})();

/* =========================================================================
   AUDIO ENGINE (Web Audio API): chord pluck, metronome & rhythm scheduler
   ========================================================================= */
const AudioEngine = (()=>{
  let ctx = null;
  function ensure(){
    if(!ctx){
      try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }
      catch(e){ toast('Ses motoru başlatılamadı','err'); return null; }
    }
    if(ctx.state==='suspended') ctx.resume();
    return ctx;
  }
  let masterVol = 0.7;
  function setVolume(v){ masterVol = v; }
  function pluckString(freq, when, dur, vol){
    const c = ensure(); if(!c) return;
    const osc = c.createOscillator();
    const osc2 = c.createOscillator();
    const gain = c.createGain();
    osc.type='triangle'; osc2.type='sine'; osc2.frequency.value=freq*2;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, when);
    gain.gain.linearRampToValueAtTime((vol!=null?vol:masterVol)*0.5, when+0.008);
    gain.gain.exponentialRampToValueAtTime(0.0001, when+dur);
    const g2 = c.createGain(); g2.gain.value=0.05;
    osc.connect(gain); osc2.connect(g2); g2.connect(gain);
    gain.connect(c.destination);
    osc.start(when); osc2.start(when);
    osc.stop(when+dur+0.02); osc2.stop(when+dur+0.02);
  }
  function strumChord(shape, opts){
    if(!shape) return;
    opts = opts || {};
    const c = ensure(); if(!c) return;
    const freqs = shapeToFrequencies(shape);
    const now = c.currentTime;
    const dir = opts.direction==='up' ? -1 : 1;
    const order = freqs.map((f,i)=>({f,i})).filter(o=>o.f).sort((a,b)=> dir*(a.i-b.i));
    order.forEach((o,k)=> pluckString(o.f, now+k*0.018, opts.dur||1.1, opts.vol));
  }
  // Drum synthesis for the rhythm/backing track. The user plays the actual guitar themselves,
  // so the app's rhythm engine shouldn't also simulate a strummed guitar over it — it should
  // sound like a drummer keeping time instead.
  function getNoiseBuffer(c, duration){
    const size = Math.max(1, Math.round(c.sampleRate*duration));
    const buffer = c.createBuffer(1, size, c.sampleRate);
    const data = buffer.getChannelData(0);
    for(let i=0;i<size;i++) data[i] = Math.random()*2-1;
    return buffer;
  }
  function kick(when){
    const c = ensure(); if(!c) return;
    const osc = c.createOscillator(); const g = c.createGain();
    osc.type='sine';
    osc.frequency.setValueAtTime(150, when);
    osc.frequency.exponentialRampToValueAtTime(45, when+0.12);
    g.gain.setValueAtTime(masterVol*1.0, when);
    g.gain.exponentialRampToValueAtTime(0.001, when+0.16);
    osc.connect(g); g.connect(c.destination);
    osc.start(when); osc.stop(when+0.17);
  }
  function snare(when){
    const c = ensure(); if(!c) return;
    const noise = c.createBufferSource(); noise.buffer = getNoiseBuffer(c, 0.2);
    const filter = c.createBiquadFilter(); filter.type='highpass'; filter.frequency.value=1200;
    const noiseGain = c.createGain();
    noiseGain.gain.setValueAtTime(masterVol*0.7, when);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, when+0.14);
    noise.connect(filter); filter.connect(noiseGain); noiseGain.connect(c.destination);
    noise.start(when); noise.stop(when+0.15);
    const osc = c.createOscillator(); const oscGain = c.createGain();
    osc.type='triangle'; osc.frequency.value=180;
    oscGain.gain.setValueAtTime(masterVol*0.45, when);
    oscGain.gain.exponentialRampToValueAtTime(0.001, when+0.09);
    osc.connect(oscGain); oscGain.connect(c.destination);
    osc.start(when); osc.stop(when+0.1);
  }
  function hihat(when, open){
    const c = ensure(); if(!c) return;
    const dur = open?0.22:0.05;
    const noise = c.createBufferSource(); noise.buffer = getNoiseBuffer(c, dur+0.02);
    const filter = c.createBiquadFilter(); filter.type='highpass'; filter.frequency.value=7500;
    const gain = c.createGain();
    gain.gain.setValueAtTime(masterVol*0.3, when);
    gain.gain.exponentialRampToValueAtTime(0.001, when+dur);
    noise.connect(filter); filter.connect(gain); gain.connect(c.destination);
    noise.start(when); noise.stop(when+dur+0.02);
  }
  // metronome / rhythm scheduler using lookahead
  let schedulerTimer=null, nextNoteTime=0, current16th=0, beatsPerMeasure=4, bpm=90, running=false;
  let onBeatCb=null, pattern=null, patternIndex=0;
  const LOOKAHEAD=0.12, INTERVAL=25;
  function metroClick(when, accent){
    const c=ensure(); if(!c) return;
    const osc=c.createOscillator(); const g=c.createGain();
    osc.frequency.value = accent?1500:900;
    g.gain.setValueAtTime(masterVol*0.5, when);
    g.gain.exponentialRampToValueAtTime(0.001, when+0.05);
    osc.connect(g); g.connect(c.destination);
    osc.start(when); osc.stop(when+0.06);
  }
  function scheduler(){
    const c = ensure(); if(!c) return;
    while(nextNoteTime < c.currentTime + LOOKAHEAD){
      const beatInMeasure = current16th % beatsPerMeasure;
      metroClick(nextNoteTime, beatInMeasure===0);
      if(pattern && pattern.length){
        const step = pattern[current16th % pattern.length];
        const secondsPerBeat = 60.0/bpm;
        if(step==='D'){ kick(nextNoteTime); hihat(nextNoteTime,false); }
        else if(step==='U'){ snare(nextNoteTime); hihat(nextNoteTime,false); }
        else if(step==='DU'){ kick(nextNoteTime); hihat(nextNoteTime+secondsPerBeat*0.5,false); }
        else if(step==='UU'){ snare(nextNoteTime); hihat(nextNoteTime+secondsPerBeat*0.5,false); }
        // '-' is a rest: no hit.
      }
      if(onBeatCb) onBeatCb(beatInMeasure, nextNoteTime);
      const secondsPerBeat = 60.0/bpm;
      nextNoteTime += secondsPerBeat;
      current16th++;
    }
    schedulerTimer = setTimeout(scheduler, INTERVAL);
  }
  return {
    ensure, setVolume, strumChord, pluckString,
    startMetronome(newBpm, sig, cb){
      const c=ensure(); if(!c) return;
      bpm = newBpm; beatsPerMeasure = parseInt(sig)||4; current16th=0; onBeatCb=cb;
      nextNoteTime = c.currentTime + 0.05;
      if(running) return;
      running=true; scheduler();
    },
    setBpm(v){ bpm=v; },
    setPattern(p){ pattern = p; },
    stopMetronome(){ running=false; clearTimeout(schedulerTimer); },
    isRunning(){ return running; },
    getCtx(){ return ctx; }
  };
})();

/* =========================================================================
   ADMIN GATE
   This app has no backend, so "admin" cannot be a real security boundary —
   anyone with devtools can bypass a client-side check. It's a soft lock so
   casual visitors on this site don't see or trigger song add/edit/delete
   controls; only someone who knows the passcode does. Songs everyone sees
   come from the published songs-data.json (see loadAll) which only the
   admin updates by using the "Yayınla" export in Settings.
   ========================================================================= */
const ADMIN_PASSWORD_HASH = '26745bd3ca43f69fc7a7da631158f09058e567925b88cb9286205e2cf6a07b3a';
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function checkAdminPassword(pw){ return (await sha256Hex(pw)) === ADMIN_PASSWORD_HASH; }
function setAdminMode(on){
  State.isAdmin = on;
  try{ if(on) localStorage.setItem('chordstage_admin','1'); else localStorage.removeItem('chordstage_admin'); }catch(e){}
  applyAdminUI();
}
function applyAdminUI(){
  document.body.classList.toggle('is-admin', !!State.isAdmin);
  if(State.currentSong) renderSongHeader();
}

function publishedSongToRecord(s){
  const rec = makeSong(Object.assign({}, s, {body:''}));
  rec.id = s.id; rec.sections = s.sections; rec.created = s.created; rec.updated = s.updated;
  return rec;
}
async function fetchPublishedSongs(){
  try{
    const res = await fetch('songs-data.json', {cache:'no-store'});
    if(!res.ok) return null;
    const data = await res.json();
    return Array.isArray(data) && data.length ? data : null;
  }catch(e){ return null; }
}
async function loadAll(){
  try{ State.isAdmin = localStorage.getItem('chordstage_admin')==='1'; }catch(e){}
  let songs = await DB.getAll('songs');
  if(!songs.length){
    // First visit on this device: seed from the admin's published catalog if reachable,
    // otherwise fall back to the songs baked into this file so the app still works offline
    // or when opened straight from disk (file://, where fetch of a sibling file can fail).
    const published = await fetchPublishedSongs();
    const seed = published ? published.map(publishedSongToRecord) : DEMO_SONGS;
    for(const s of seed) await DB.put('songs', s);
    songs = seed;
  }
  State.songs = songs;
  let rhythms = await DB.getAll('rhythms');
  if(!rhythms.length){
    for(const r of DEMO_RHYTHMS) await DB.put('rhythms', r);
    rhythms = DEMO_RHYTHMS;
  }
  State.rhythms = rhythms;
  State.setlists = await DB.getAll('setlists');
  const meta = await DB.get('meta','settings');
  if(meta) Object.assign(State.settings, meta.value);
  const rec = await DB.get('meta','recent');
  if(rec) State.recentIds = rec.value;
  applySettingsToUI();
  applyAdminUI();
}
async function refreshFromPublished(){
  const published = await fetchPublishedSongs();
  if(!published){ toast('Yayınlanan liste alınamadı (bağlantı yok olabilir)','err'); return; }
  let added = 0;
  for(const s of published){
    if(!State.songs.some(existing=>existing.id===s.id)){
      const rec = publishedSongToRecord(s);
      await DB.put('songs', rec);
      State.songs.push(rec);
      added++;
    }
  }
  renderSongList();
  toast(added ? `${added} yeni şarkı eklendi` : 'Zaten güncel');
}
/* Keep the phone screen from sleeping while playing — hands are on the guitar, not the screen. */
const ScreenWake = (()=>{
  let lock = null;
  async function request(){
    if(lock || !('wakeLock' in navigator)) return;
    try{ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', ()=>{ lock=null; }); }
    catch(e){ lock = null; }
  }
  function release(){ if(lock){ lock.release().catch(()=>{}); lock=null; } }
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && State.player.playing) request();
  });
  return {request, release};
})();
function saveSettings(){ DB.put('meta',{key:'settings', value:State.settings}); }
function pushRecent(id){
  State.recentIds = [id, ...State.recentIds.filter(x=>x!==id)].slice(0,15);
  DB.put('meta',{key:'recent', value:State.recentIds});
}

/* =========================================================================
   RENDERING: SIDEBAR / LIBRARY
   ========================================================================= */
function allTags(){
  const set = new Set();
  State.songs.forEach(s=> (s.tags||[]).forEach(t=>set.add(t)));
  return Array.from(set);
}
function renderCategoryTags(){
  const el = $('#categoryTags');
  const tags = allTags();
  el.innerHTML = tags.map(t=>`<span class="tagchip ${State.filter.tag===t?'active':''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join('');
}
function filteredSongs(){
  let list = State.songs.slice();
  const q = State.filter.q.trim().toLowerCase();
  if(q){
    list = list.filter(s=> [s.title,s.artist,s.key,(s.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));
  }
  if(State.filter.fav) list = list.filter(s=>s.favorite);
  if(State.filter.tag) list = list.filter(s=> (s.tags||[]).includes(State.filter.tag));
  if(State.filter.recent){
    list = State.recentIds.map(id=> State.songs.find(s=>s.id===id)).filter(Boolean);
  } else {
    list = list.sort((a,b)=> a.title.localeCompare(b.title,'tr'));
  }
  return list;
}
let renderedCount = 0;
function renderSongList(){
  renderCategoryTags();
  const list = filteredSongs();
  const el = $('#songList');
  const BATCH = 40;
  renderedCount = Math.min(BATCH, list.length);
  el.innerHTML = list.slice(0, renderedCount).map(songItemHtml).join('') ||
    `<div style="color:var(--text-dim); padding:20px; text-align:center;">Şarkı bulunamadı</div>`;
  el.onscroll = ()=>{
    if(el.scrollTop + el.clientHeight > el.scrollHeight - 60 && renderedCount < list.length){
      const more = list.slice(renderedCount, renderedCount+BATCH);
      el.insertAdjacentHTML('beforeend', more.map(songItemHtml).join(''));
      renderedCount += more.length;
    }
  };
}

  else if(name==='rhythmlib'){ $('#viewRhythmLib').classList.remove('hidden'); renderRhythmGrid(); }

function openSong(id){
  const s = State.songs.find(x=>x.id===id);
  if(!s) return;
  stopPlayback();
  closeBeatPopover();
  State.currentSong = s;
  State.transpose = 0;
  State.player.autoScrollSpeed = s.scrollSpeed ?? 100;
  pushRecent(id);
  renderSongList();
  showView('song');
  renderSongHeader();
  renderLyrics();
  renderTransport();
  buildTimeline();
}
function effectiveSections(){
  const s = State.currentSong;
  if(!s) return [];
  if(State.transpose===0) return s.sections;
  return transposeSections(s.sections, State.transpose, keyPrefersFlats(s.key));
}
function displayedKey(){
  const s = State.currentSong; if(!s) return '';
  if(State.transpose===0) return s.key;
  const p = parseChordName(s.key.replace(/m$/,'')+(s.key.endsWith('m')?'':''));
  const isMinor = /m$/.test(s.key) && !/maj/i.test(s.key);
  const root = s.key.replace(/m$/,'');
  const idx = noteIndex(root);
  if(idx==null) return s.key;
  return noteName(idx+State.transpose, keyPrefersFlats(s.key)) + (isMinor?'m':'');
}

function renderLyrics(){
  const s = State.currentSong;
  const sections = effectiveSections();
  const el = $('#lyricsWrap');
  el.style.setProperty('--font-lyrics', State.settings.fontSize+'rem');
  el.innerHTML = sections.map((sec,si)=>{
    const lines = sec.lines.map((line,li)=>{
      if(!line.units.length || (line.units.length===1 && !line.units[0].chord && !line.units[0].text.trim())){
        return `<div class="emptyline"></div>`;
      }
      const clus = line.units.map((u,ui)=>{
        const words = u.text.length ? escapeHtml(u.text) : '&nbsp;';
        return `<span class="clu" data-sec="${si}" data-line="${li}" data-u="${ui}">${chordTagSpan(u.chord)}<span class="lyricword clickable" data-sec="${si}" data-line="${li}" data-u="${ui}">${words}</span></span>`;
      }).join('');
      return `<div class="lyric-line">${clus}</div>`;
    }).join('');
    const repeat = sec.repeat||1;
    const repeatBadge = repeat>1 ? `<span class="repeat-badge">×${repeat}</span>` : '';
    const repeatBtn = State.isAdmin ? `<button class="btn icon repeat-edit" data-si="${si}" title="Tekrar sayısı">🔁</button>` : '';
    const copyBtn = State.isAdmin ? `<button class="btn icon section-copy" data-si="${si}" title="Bölümü kopyala (söz + akor + süreleriyle)">📋</button>` : '';
    return `<div class="section-block"><div class="section-title">${escapeHtml(sec.name)}${repeatBadge}${repeatBtn}${copyBtn}</div>${lines}</div>`;
  }).join('');
}
$('#lyricsWrap').addEventListener('click', e=>{
  const repeatBtn = e.target.closest('.repeat-edit');
  if(repeatBtn){ openRepeatPopoverAt(repeatBtn, +repeatBtn.dataset.si); return; }
  const copyBtn = e.target.closest('.section-copy');
  if(copyBtn){ copySection(+copyBtn.dataset.si); return; }
  const chordTag = e.target.closest('.chordtag');
  if(chordTag){
    showChordDetail(chordTag.dataset.chord);
    if(State.isAdmin){
      // Adjusting a chord's timing while the rhythm is running fights with the very thing
      // being adjusted, so pause for the edit — then pick back up from the same spot once
      // the popover closes, instead of restarting the song.
      if(State.player.playing){ State.player.resumeAfterBeatEdit = true; pausePlayback(); }
      openBeatPopoverAt(chordTag);
    }
    return;
  }
  const word = e.target.closest('.lyricword');
  if(!word) return;
  if(State.player.playing){
    // Jump playback to wherever was just tapped and keep going, instead of ignoring the tap.
    const sec=+word.dataset.sec, line=+word.dataset.line, u=+word.dataset.u;
    const idx = timelineIndexAtOrBefore(sec,line,u);
    if(idx>=0) seekToIndex(idx);
    return;
  }
  if(!State.isAdmin){ toast('Söz/akor düzenlemek için admin girişi gerekiyor (Ayarlar)'); return; }
  openChordPickerAt(word);
});
function timelineIndexAtOrBefore(sec,line,u){
  const tl = State.player.timeline;
  let idx = -1;
  for(let i=0;i<tl.length;i++){
    const seg = tl[i];
    const cmp = seg.sec-sec || seg.line-line || seg.u-u;
    if(cmp<=0) idx=i; else break;
  }
  return idx<0 ? 0 : idx;
}

function stringInfoText(shape){
  if(!shape) return '';
  const names=['E (kalın)','A','D','G','B','e (ince)'];
  return shape.frets.map((f,i)=> `${names[i]} | ${f===-1?'X (kapalı)': f===0?'0 (açık)': (f+(shape.baseFret-1))+' (parmak '+ (shape.fingers?shape.fingers[i]:'')+')'}`).join('\n');
}

/* =========================================================================
   CHORD PICKER (click on lyric word to attach a chord)
   ========================================================================= */
const CHORD_SUGGEST_BASE = Object.keys(CHORD_SHAPES);
function openChordPickerAt(wordEl){
  const picker = $('#chordPicker');
  const rect = wordEl.getBoundingClientRect();
  picker.classList.remove('hidden');
  let top = rect.bottom+6, left = rect.left;
  if(left+260>window.innerWidth) left = window.innerWidth-270;
  if(top+340>window.innerHeight) top = rect.top-346;
  picker.style.top = top+'px'; picker.style.left = left+'px';
  const sec = +wordEl.dataset.sec, line = +wordEl.dataset.line, u = +wordEl.dataset.u;
  const currentUnit = State.currentSong.sections[sec].lines[line].units[u];
  picker.innerHTML = `<input type="text" id="cpInput" placeholder="Akor ara veya yaz (örn: Am7)" autocomplete="off" value="${currentUnit.chord?escapeHtml(currentUnit.chord):''}">
    <div id="cpList"></div>
    ${currentUnit.chord?'<div class="cp-item cp-remove" id="cpRemove">✕ Akoru kaldır</div>':''}`;
  const input = $('#cpInput', picker);
  function renderList(){
    const q = input.value.trim().toLowerCase();
    let opts = CHORD_SUGGEST_BASE.filter(c=> c.toLowerCase().startsWith(q));
    if(q && !opts.includes(input.value.trim())) opts = [input.value.trim(), ...opts].filter(Boolean);
    $('#cpList', picker).innerHTML = opts.slice(0,25).map(c=>`<div class="cp-item" data-c="${escapeHtml(c)}">${escapeHtml(c)}</div>`).join('');
  }
  renderList();
  input.oninput = renderList;
  input.focus();
  picker.onclick = e=>{
    const item = e.target.closest('.cp-item:not(.cp-remove)');
    if(item){ setChordOnUnit(sec,line,u,item.dataset.c); closeChordPicker(); return; }
    if(e.target.id==='cpRemove'){ setChordOnUnit(sec,line,u,null); closeChordPicker(); }
  };
  input.onkeydown = e=>{
    if(e.key==='Enter' && input.value.trim()){ setChordOnUnit(sec,line,u,input.value.trim()); closeChordPicker(); }
    if(e.key==='Escape') closeChordPicker();
  };
  setTimeout(()=> document.addEventListener('click', outsidePickerClick), 0);
}
function outsidePickerClick(e){
  const picker = $('#chordPicker');
  if(!picker.contains(e.target)){ closeChordPicker(); }
}
function closeChordPicker(){
  $('#chordPicker').classList.add('hidden');
  document.removeEventListener('click', outsidePickerClick);
}
function setChordOnUnit(sec,line,u,chord){
  const s = State.currentSong;
  s.sections[sec].lines[line].units[u].chord = chord;
  s.updated = Date.now();
  DB.put('songs', s);
  State.transpose = 0;
  renderLyrics();
  buildTimeline();
}

let tapTimes = [];
function tapTempo(){
  const now = performance.now();
  tapTimes = tapTimes.filter(t=> now-t < 2500);
  tapTimes.push(now);
  if(tapTimes.length>=2){
    const diffs = []; for(let i=1;i<tapTimes.length;i++) diffs.push(tapTimes[i]-tapTimes[i-1]);
    const avg = diffs.slice(-8).reduce((a,b)=>a+b,0)/Math.min(diffs.length,8);
    const bpm = clamp(Math.round(60000/avg),40,240);
    State.currentSong.bpm = bpm; DB.put('songs',State.currentSong);
    renderSongHeader(); renderTransport();
  }
}

// ---- Timeline generation: distribute chords across time using bpm + chordDuration(beats) ----
function flattenWordUnits(sections){
  // A section with a repeat count (e.g. a chorus sung twice) contributes its chord/word
  // sequence that many times in a row — same words on screen, but the timeline (and so the
  // audio/rhythm) actually cycles through it repeat-many times.
  const flat = [];
  sections.forEach((sec,si)=>{
    const repeat = Math.max(1, sec.repeat||1);
    for(let pass=0; pass<repeat; pass++){
      sec.lines.forEach((line,li)=> line.units.forEach((u,ui)=>{
        flat.push({sec:si, line:li, u:ui, chord:u.chord});
      }));
    }
  });
  return flat;
}
// The editor's only job: how many beats hold between this chord and the next one. Each chord
// occurrence gets its own gap (song.chordGaps, in sequence order) instead of one rule applied
// to the whole song.
function buildTimeline(){
  const s = State.currentSong;
  const sections = effectiveSections();
  const secondsPerBeat = 60/s.bpm;
  const defaultBeats = s.chordDuration || 2;
  const gaps = s.chordGaps || [];
  let t = 0;
  const timeline = [];
  let chordIdx = 0;
  flattenWordUnits(sections).forEach(fu=>{
    if(fu.chord){
      const beats = gaps[chordIdx]!=null ? gaps[chordIdx] : defaultBeats;
      timeline.push({t, chord:fu.chord, sec:fu.sec, line:fu.line, u:fu.u, beats});
      t += beats*secondsPerBeat;
      chordIdx++;
    }
  });
  State.player.timeline = timeline;
  State.player.duration = t;
  renderChordFlow(-1);
  renderTimelineBar();
}
function renderTimelineBar(){
  const bar = $('#timelineBar');
  const tl = State.player.timeline;
  const dur = State.player.duration || 1;
  $$('.tl-seg',bar).forEach(n=>n.remove());
  tl.forEach((seg,i)=>{
    const next = tl[i+1] ? tl[i+1].t : dur;
    const width = ((next-seg.t)/dur)*100;
    const left = (seg.t/dur)*100;
    const div = document.createElement('div');
    div.className='tl-seg'; div.dataset.idx=i;
    div.style.left = left+'%'; div.style.width = Math.max(width,2)+'%';
    div.textContent = seg.chord;
    div.onclick = ()=> seekToIndex(i);
    bar.appendChild(div);
  });
}
function renderChordFlow(activeIdx){
  const tl = State.player.timeline;
  const el = $('#chordFlow');
  const prev = tl[activeIdx-1], cur = tl[activeIdx], next = tl[activeIdx+1], next2 = tl[activeIdx+2];
  function box(seg,label,cls){
    return `<div class="cf-box ${cls}"><div class="lbl">${label}</div><div class="cname">${seg?escapeHtml(seg.chord):'—'}</div></div>`;
  }
  el.innerHTML = `${box(prev,'Önceki','prev')}<span class="arrow">→</span>${box(cur,'ŞİMDİ','now')}<span class="arrow">→</span>${box(next,'Sonraki','next')}<span class="arrow">→</span>${box(next2,'','')}`;
}

function togglePlay(){ State.player.playing ? pausePlayback() : startPlayback(); }
function startPlayback(){
  AudioEngine.ensure();
  const s = State.currentSong;
  const rhythm = currentRhythm();
  const bpm = State.player.mode==='rehearsal' ? Math.max(30, Math.round(s.bpm/2)) : s.bpm;
  AudioEngine.setPattern(rhythm.pattern);
  AudioEngine.startMetronome(bpm, s.timeSig, onBeat);
  $('#nowPlaying').classList.add('show');
  State.player.playing = true;
  $('#btnPlay').textContent = '⏸';
  State.player.startTime = performance.now()/1000 - (State.player.pausedAt||0);
  State.player.autoScrollSpeed = State.player.autoScrollSpeed ?? 100;
  updateHeaderCompact();
  ScreenWake.request();
  tickPlayback();
}
function pausePlayback(){
  State.player.playing = false;
  State.player.pausedAt = performance.now()/1000 - State.player.startTime;
  AudioEngine.stopMetronome();
  $('#btnPlay').textContent = '▶';
  cancelAnimationFrame(State.player.rafId);
  updateHeaderCompact();
}
function stopPlayback(){
  State.player.playing = false;
  State.player.pausedAt = 0;
  State.player.resumeAfterBeatEdit = false;
  AudioEngine.stopMetronome();
  ScreenWake.release();
  cancelAnimationFrame(State.player.rafId);
  if($('#btnPlay')) $('#btnPlay').textContent='▶';
  $('#nowPlaying') && $('#nowPlaying').classList.remove('show');
  updateHeaderCompact();
  highlightChordAt(-1);
  if(State.player.timeline) renderChordFlow(-1);
}
let beatCounter=0;
function onBeat(beatInMeasure, when){
  beatCounter++;
  const dots = $$('.beatdot');
  dots.forEach((d,i)=> d.classList.toggle('on', i===beatInMeasure));
}
function currentActiveChordName(){
  const idx = State.player.activeIdx;
  const seg = State.player.timeline[idx];
  return seg ? seg.chord : null;
}
function tickPlayback(){
  if(!State.player.playing) return;
  const elapsed = performance.now()/1000 - State.player.startTime;
  const tl = State.player.timeline;
  let idx = -1;
  for(let i=0;i<tl.length;i++){ if(tl[i].t<=elapsed) idx=i; else break; }
  if(idx !== State.player.activeIdx){
    State.player.activeIdx = idx;
    highlightChordAt(idx);
    renderChordFlow(idx);
  }
  updateTimelineCursor(elapsed);
  if(State.player.autoScrollSpeed>0) autoScrollStep();
  if(elapsed > (State.player.duration||0) + 2){ stopPlayback(); return; }
  State.player.rafId = requestAnimationFrame(tickPlayback);
}
function updateTimelineCursor(elapsed){
  const dur = State.player.duration||1;
  $('#tlCursor').style.left = clamp((elapsed/dur)*100,0,100)+'%';
}
function highlightChordAt(idx){
  $$('.clu').forEach(c=> c.classList.remove('playing-chord','upcoming-chord'));
  $$('.tl-seg').forEach(c=> c.classList.remove('active'));
  const seg = State.player.timeline[idx];
  if(!seg) return;
  const sel = `.clu[data-sec="${seg.sec}"][data-line="${seg.line}"][data-u="${seg.u}"]`;
  const node = $(sel);
  if(node){
    node.classList.add('playing-chord');
    State.player.activeNode = node;
    // While actively playing, the continuous per-frame follow in autoScrollStep() handles
    // scrolling (a competing scrollIntoView here would fight it and stall/jank the scroll).
    // For manual navigation (paused), jump straight to it.
    if(!State.player.playing && State.player.autoScrollSpeed>0) node.scrollIntoView({block:'center', behavior:'smooth'});
  } else {
    State.player.activeNode = null;
  }
  const nextSeg = State.player.timeline[idx+1];
  if(nextSeg){
    const nsel = `.clu[data-sec="${nextSeg.sec}"][data-line="${nextSeg.line}"][data-u="${nextSeg.u}"]`;
    const nnode = $(nsel); if(nnode) nnode.classList.add('upcoming-chord');
  }
  const tlSeg = $(`.tl-seg[data-idx="${idx}"]`); if(tlSeg) tlSeg.classList.add('active');
}
function autoScrollStep(){
  // Continuously eases the view toward the active chord/line's position instead of
  // scrolling at a fixed pixel rate. A fixed rate falls behind on fast/dense songs and
  // the part the user needs to see slides off-screen; easing toward the actual target
  // position every frame means it always catches up, just faster or slower per the
  // speed setting, and it never fights with any other scroll call.
  if(performance.now() < (State.player.userScrollUntil||0)) return;
  const node = State.player.activeNode;
  if(!node) return;
  const wrap = $('#lyricsWrap');
  const wrapRect = wrap.getBoundingClientRect();
  const nodeRect = node.getBoundingClientRect();
  const targetY = wrapRect.top + wrapRect.height*0.32;
  const delta = nodeRect.top - targetY;
  if(Math.abs(delta) < 2) return;
  const speedFactor = clamp((State.player.autoScrollSpeed||100)/100, 0.1, 3);
  const ease = clamp(0.14*speedFactor, 0.03, 0.6);
  wrap.scrollTop += delta*ease;
}
function seekToIndex(i){
  const tl = State.player.timeline;
  if(!tl[i]) return;
  State.player.pausedAt = tl[i].t;
  State.player.startTime = performance.now()/1000 - tl[i].t;
  State.player.activeIdx = i;
  highlightChordAt(i); renderChordFlow(i); updateTimelineCursor(tl[i].t);
}
function stepChord(dir){
  const tl = State.player.timeline;
  let idx = clamp((State.player.activeIdx<0?-1:State.player.activeIdx)+dir, 0, tl.length-1);
  seekToIndex(idx);
  if(!State.player.playing){
    const shape = getChordShape(tl[idx].chord);
    AudioEngine.strumChord(shape,{direction:'down',dur:1,vol:State.settings.volume});
    showChordDetail(tl[idx].chord);
  }
}
// A guitarist's hands are on the guitar, not the phone — auto-scroll during playback must not
// need to be manually re-enabled after every incidental touch (tapping a word to jump there,
// bumping the screen). It now only yields *while* a finger is actually down/dragging, resuming
// by itself right after, instead of a single tap permanently switching it off.
function suppressAutoScrollBriefly(){ State.player.userScrollUntil = performance.now() + 900; }
$('#lyricsWrap').addEventListener('pointerdown', suppressAutoScrollBriefly);
$('#lyricsWrap').addEventListener('pointermove', suppressAutoScrollBriefly);
$('#lyricsWrap').addEventListener('touchmove', suppressAutoScrollBriefly, {passive:true});

/* =========================================================================
   CHORD GAP EDITOR — a plain list of the song's chords in order, each with
   a +/- stepper that sets only the gap (in beats) to the next chord.
   ========================================================================= */
function chordOccurrenceIndex(sections, sec, line, u){
  let idx = 0;
  for(const fu of flattenWordUnits(sections)){
    if(fu.chord){
      if(fu.sec===sec && fu.line===line && fu.u===u) return idx;
      idx++;
    }
  }
  return -1;
}
function openBeatPopoverAt(chordTagEl){
  const clu = chordTagEl.closest('.clu');
  if(!clu) return;
  const sec=+clu.dataset.sec, line=+clu.dataset.line, u=+clu.dataset.u;
  const s = State.currentSong;
  const sections = effectiveSections();
  const idx = chordOccurrenceIndex(sections, sec, line, u);
  if(idx<0) return;
  const gaps = (s.chordGaps||[]).slice();
  let beats = gaps[idx]!=null ? gaps[idx] : (s.chordDuration||2);
  const pop = $('#beatPopover');
  pop.classList.remove('hidden');
  const rect = chordTagEl.getBoundingClientRect();
  let top = rect.bottom+6, left = rect.left;
  if(left+180>window.innerWidth) left = window.innerWidth-190;
  if(top+50>window.innerHeight) top = rect.top-56;
  pop.style.top = top+'px'; pop.style.left = left+'px';
  function render(){
    pop.innerHTML = `<span class="bp-chord">${escapeHtml(chordTagEl.dataset.chord)}</span>
      <button class="btn icon bp-minus">–</button>
      <span class="bp-val">${beats}v</span>
      <button class="btn icon bp-plus">+</button>`;
    $('.bp-minus',pop).onclick = ()=>{ beats = clamp(beats-0.25,0.25,32); save(); render(); };
    $('.bp-plus',pop).onclick = ()=>{ beats = clamp(beats+0.25,0.25,32); save(); render(); };
  }
  async function save(){
    gaps[idx] = beats;
    s.chordGaps = gaps;
    s.updated = Date.now();
    await DB.put('songs', s);
    buildTimeline();
  }
  render();
  // Capture phase, not bubble: the +/- buttons re-render (replace) themselves on click, so by
  // the time a bubble-phase document listener saw the click, the clicked button node would
  // already be detached and read as "outside" the popover, closing it on every tap. Capture
  // fires before that re-render happens.
  setTimeout(()=> document.addEventListener('click', outsideBeatPopoverClick, true), 0);
}
function outsideBeatPopoverClick(e){
  const pop = $('#beatPopover');
  if(!pop.contains(e.target) && !e.target.closest('.chordtag') && !e.target.closest('.repeat-edit')){ closeBeatPopover(); }
}
function closeBeatPopover(){
  $('#beatPopover').classList.add('hidden');
  document.removeEventListener('click', outsideBeatPopoverClick, true);
  if(State.player.resumeAfterBeatEdit){
    State.player.resumeAfterBeatEdit = false;
    startPlayback();
  }
}
// Duplicate a section — lyrics, chords, and each chord's set beat-gap — as a new section right
// after it, for writing a repeat (verse 2 with the same chords, a chorus sung again) by copying
// instead of retyping and re-tuning every chord's timing from scratch.
async function copySection(si){
  const s = State.currentSong;
  const sections = s.sections;
  const startIdx = flattenWordUnits(sections.slice(0,si)).length;
  const countInSec = flattenWordUnits([sections[si]]).length;
  const totalChords = flattenWordUnits(sections).length;
  const gaps = (s.chordGaps||[]).slice();
  while(gaps.length < totalChords) gaps.push(s.chordDuration||2);
  const slice = gaps.slice(startIdx, startIdx+countInSec);
  gaps.splice(startIdx+countInSec, 0, ...slice);
  const clone = JSON.parse(JSON.stringify(sections[si]));
  clone.name = clone.name + ' (kopya)';
  sections.splice(si+1, 0, clone);
  s.chordGaps = gaps;
  s.updated = Date.now();
  await DB.put('songs', s);
  buildTimeline();
  renderLyrics();
  toast('Bölüm akorları ve süreleriyle kopyalandı');
}
function openRepeatPopoverAt(btn, si){
  const s = State.currentSong;
  let n = s.sections[si].repeat || 1;
  const pop = $('#beatPopover');
  pop.classList.remove('hidden');
  const rect = btn.getBoundingClientRect();
  let top = rect.bottom+6, left = rect.left;
  if(left+180>window.innerWidth) left = window.innerWidth-190;
  if(top+50>window.innerHeight) top = rect.top-56;
  pop.style.top = top+'px'; pop.style.left = left+'px';
  function render(){
    pop.innerHTML = `<span class="bp-chord">🔁 Tekrar</span>
      <button class="btn icon bp-minus">–</button>
      <span class="bp-val">${n}×</span>
      <button class="btn icon bp-plus">+</button>`;
    $('.bp-minus',pop).onclick = ()=>{ n = clamp(n-1,1,16); save(); render(); };
    $('.bp-plus',pop).onclick = ()=>{ n = clamp(n+1,1,16); save(); render(); };
  }
  async function save(){
    s.sections[si].repeat = n;
    s.updated = Date.now();
    await DB.put('songs', s);
    buildTimeline();
    renderLyrics();
  }
  render();
  setTimeout(()=> document.addEventListener('click', outsideBeatPopoverClick, true), 0);
}
